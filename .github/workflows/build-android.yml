name: Build Android App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Read version
        run: |
          if [ -f version.properties ]; then
            source version.properties
            echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          fi
        shell: bash
      
      - name: Build Android APK & AAB
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
      
      - name: Copy outputs
        run: |
          mkdir -p build-output/android
          cp android-app/app/build/outputs/apk/release/*.apk \
             build-output/android/greenix-studio-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}.apk || true
          cp android-app/app/build/outputs/bundle/release/*.aab \
             build-output/android/greenix-studio-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}.aab || true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build-output/android/

          
