name: Build iOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        shell: bash
        run: |
          if [ -f version.properties ]; then
            set -a
            . ./version.properties
            set +a
          fi
          echo "VERSION_NAME=${VERSION_NAME:-0.1.0}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE:-1}" >> $GITHUB_ENV

      - name: Prepare third party keys
        working-directory: ios
        run: cp ThirdPartyKeys.example.plist ThirdPartyKeys.plist

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Set version in Info.plist
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION_NAME}" swift-ui-base/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION_CODE}" swift-ui-base/Info.plist

      - name: Build iOS app
        working-directory: ios
        run: |
          xcodebuild clean build \
            -workspace swift-ui-base.xcworkspace \
            -scheme swift-ui-base \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=${VERSION_NAME} \
            CURRENT_PROJECT_VERSION=${VERSION_CODE} \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Using app bundle: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p ../build-output/ios
          zip -qry "../build-output/ios/greenix-studio-ios-v${VERSION_NAME}-${VERSION_CODE}.ipa" Payload
          ls -l ../build-output/ios

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build-output/ios/

      - name: Commit build outputs back to repository
        shell: bash
        run: |
          git config user.name "mood810"
          git config user.email "mahmoodkaliika810@gmail.com"
          git checkout -- ios/swift-ui-base/Info.plist || true
          git add -f build-output/ios
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: add iOS IPA for v${VERSION_NAME} (${VERSION_CODE})"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected, rebasing and retrying ($i)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
