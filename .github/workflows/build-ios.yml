name: Build iOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          if [ -f version.properties ]; then
            set -a
            . ./version.properties
            set +a
          fi
          echo "VERSION_NAME=${IOS_VERSION_NAME:-0.1.0}" >> $GITHUB_ENV
          echo "VERSION_CODE=${IOS_VERSION_CODE:-1}" >> $GITHUB_ENV

      - name: Build iOS app
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project GreenixStudio.xcodeproj \
            -scheme GreenixStudio \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=${VERSION_NAME} \
            CURRENT_PROJECT_VERSION=${VERSION_CODE} \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Using app bundle: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p ../build-output/ios
          zip -qry "../build-output/ios/greenix-studio-ios-v${VERSION_NAME}-${VERSION_CODE}.ipa" Payload
          ls -l ../build-output/ios

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build-output/ios/
