name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          if [ -f version.properties ]; then
            set -a
            . ./version.properties
            set +a
          fi
          echo "VERSION_NAME=${MACOS_VERSION_NAME:-0.1.0}" >> $GITHUB_ENV
          echo "VERSION_CODE=${MACOS_VERSION_CODE:-1}" >> $GITHUB_ENV

      - name: Build macOS app
        working-directory: macos
        run: swift build -c release

      - name: Copy outputs
        shell: bash
        run: |
          mkdir -p build-output/macos
          cp macos/.build/release/GreenixStudio \
             "build-output/macos/greenix-studio-macos-v$VERSION_NAME-$VERSION_CODE"
          ls -l build-output/macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build-output/macos/
