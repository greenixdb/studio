name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read version
        shell: bash
        run: |
          if [ -f version.properties ]; then
            set -a
            . ./version.properties
            set +a
          fi
          echo "VERSION_NAME=${WINDOWS_VERSION_NAME:-0.1.0}" >> $GITHUB_ENV
          echo "VERSION_CODE=${WINDOWS_VERSION_CODE:-1}" >> $GITHUB_ENV

      - name: Publish Windows app
        shell: pwsh
        run: >
          dotnet publish windows/GreenixStudio.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:Version=${{ env.VERSION_NAME }}
          -p:FileVersion=${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}
          -o publish-out

      - name: Copy outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output/windows | Out-Null
          Copy-Item publish-out/GreenixStudio.exe "build-output/windows/greenix-studio-windows-v$env:VERSION_NAME-$env:VERSION_CODE.exe" -Force
          Get-ChildItem build-output/windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build-output/windows/
